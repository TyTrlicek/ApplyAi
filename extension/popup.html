<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 220px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13px;
        background: #1b1f23;
        color: #e6e6e6;
        margin: 0;
        padding: 12px;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      #status {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #999;
      }
      .dot.ok {
        background: #22c55e;
      }
      .dot.down {
        background: #f87171;
      }
      p.hint {
        color: #999;
        margin-top: 8px;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>ApplyAi</h1>
    <div id="status"><span class="dot"></span><span id="status-text">Checking…</span></div>
    <p class="hint">Open a LinkedIn job posting to see the Apply widget.</p>
    <script src="popup.js"></script>
  </body>
</html>
