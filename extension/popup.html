<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        background: #16181d;
        color: #e7e7ea;
        margin: 0;
        padding: 14px;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 6px 0;
        color: #b6bac2;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #6b7280;
        flex: none;
      }
      .dot.ok { background: #22c55e; }
      .dot.down { background: #f87171; }
      .dot.warn { background: #fcd34d; }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 9px;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 7px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .hint {
        color: #8a8f98;
        margin-top: 10px;
        font-size: 11px;
        line-height: 1.5;
      }
      code { color: #c4b5fd; font-size: 10.5px; }
    </style>
  </head>
  <body>
    <h1>⚡ ApplyAi</h1>
    <div class="row"><span class="dot" id="d-backend"></span><span id="t-backend">Checking backend…</span></div>
    <div class="row"><span class="dot" id="d-profile"></span><span id="t-profile">Profile…</span></div>
    <div class="row"><span class="dot" id="d-resume"></span><span id="t-resume">Resume…</span></div>

    <button id="fill" disabled>Autofill this page</button>

    <p class="hint" id="hint">
      Auto-runs on Greenhouse, Lever, Ashby, Workday, iCIMS, Workable, SmartRecruiters,
      BambooHR, Jobvite. On any other application page, click “Autofill this page”.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
